name: flappymiata
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.13.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # WHERE `cupertino_icons` WENT, and why it is not coming back:
  #
  # It was the Flutter template's default and this app never used it. It is a
  # font and nothing else — `CupertinoIcons.ttf`, 258 KB of glyphs — and it was
  # being copied into every APK because it was listed here, not because
  # anything drew from it. `grep -rn "cupertino" lib/ test/ tool/ -i` returns
  # nothing, and `grep -rn "package:flutter/cupertino" .` returns nothing: this
  # app draws its own buttons out of `Container` and `Text`, so there is no
  # icon set to be an alternative to.
  #
  # It cost 116 KB of the compressed APK. That is a small number on its own and
  # it is the whole point: it is 116 KB of a font nobody can see, in a build
  # measured against a size bar.
  flame: ^1.38.2

  # The ONE dependency added for high-score persistence, and the reason it is
  # here rather than a file written by hand:
  #
  # Storing a score needs a directory that is writable and that survives an app
  # update, and on Android and iOS the only way to learn where that is, is to
  # ask the platform over a method channel. So "just write a file" is not
  # dependency-free — it is `path_provider` PLUS the encoding, the atomic write
  # and the corrupt-file handling. This is one package instead of one package
  # and a pile of code, it is maintained by the Flutter team, and what is being
  # stored is a single short string.
  #
  # Nothing in `lib/game/` imports it, and nothing may: that directory is pure
  # Dart with no I/O, which is what makes the model replayable and its fairness
  # provable. See `lib/ui/high_score_store.dart`.
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # OFF, AND THE APP HAS NEVER USED IT.
  #
  # `uses-material-design: true` does exactly one thing: it bundles
  # `MaterialIcons-Regular.otf` as an asset. It is not what makes Material
  # widgets work and switching it off does not take a widget away — it takes a
  # FONT away, and that font is only readable through `Icons.*`, which needs
  # `package:flutter/material.dart`.
  #
  # This app imports `package:flutter/widgets.dart` and never Material:
  # `grep -rn "package:flutter/material" lib/ test/` returns nothing, and
  # `grep -rn "Icons\.\|IconData\|Icon(" lib/` returns nothing. Every screen in
  # `lib/ui/game_screens.dart` is built from `Container`, `Text` and
  # `GestureDetector`, and every glyph on screen is a letter.
  #
  # WHY IT WAS COSTING THE FULL 1.6 MB rather than being tree-shaken to
  # nothing: the icon tree-shaker walks the compiled app for const `IconData`
  # instances and keeps the code points it finds. With zero `IconData` in the
  # program there is nothing for it to walk, and the build kept the whole font.
  # An optimisation that only fires when the feature is used cannot fire on an
  # app that does not use the feature at all — the fix is to stop asking for
  # the asset, which is this line.
  #
  # It cost 556 KB of the compressed APK, and 1.6 MB of the installed one.
  #
  # TURN THIS BACK ON THE MOMENT ANY FILE IMPORTS `package:flutter/material.dart`
  # AND DRAWS AN `Icon`. Without it that icon renders as an empty box, and it
  # will do so silently — there is no build error for a missing glyph.
  uses-material-design: false
  assets:
    - assets/sprites/

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
