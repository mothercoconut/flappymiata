# =============================================================================
# flappymiata — continuous integration
# =============================================================================
#
# WHAT THIS FILE IS FOR
#
# Six things have to be true before a change is allowed onto `main`. This file
# is the machine that checks all six on every push and every pull request, so
# that "it worked on my laptop" stops being the standard of evidence.
#
#   1. the code still analyses clean          (`flutter analyze`)
#   2. the whole test suite still passes      (`flutter test`)
#   3. the Android app still builds           (`flutter build apk --debug`)
#   4. the shipped course is still winnable   (`tool/prove_fairness.dart`)
#   5. the mutation tool can still tell its three verdicts apart
#                                             (`tool/mutate.dart --selftest`)
#   6. the test suite still kills mutants     (`tool/mutate.dart --quick`)
#
# EVERY ONE OF THESE HAS BEEN OBSERVED FAILING. That matters more than it
# sounds. A CI job whose steps cannot fail is worse than no CI at all, because
# it produces a green tick that nobody has any reason to trust. Before this file
# was committed, each of the six commands below was run locally against a
# deliberately broken tree, and each was confirmed to exit non-zero and to name
# the real cause; each broken file was then restored and checked byte-for-byte
# by SHA-256, and the command re-run to confirm it went green again.
#
# HOW GITHUB DECIDES A STEP FAILED
#
# It reads the process exit code. Nothing else. Not the words "FAILED" in the
# output, not a red line, not a summary count — the exit code, and only that.
# This is not a theoretical concern for this repo: a Dart `Future<int> main()`
# has its return value *discarded* by the VM (only a synchronous `int main()`
# sets the exit code), so a tool that ended with `return 1` would exit 0 and
# every one of its findings would sail past the gate. `tool/mutate.dart` carries
# a comment about exactly that bug and sets `exitCode` explicitly instead.
#
# WHY FIVE JOBS AND NOT ONE
#
# Steps inside a job run one after another and stop at the first failure. Jobs
# run in parallel on separate machines and each gets its own tick in the pull
# request. Splitting the work means:
#   * one red tick names the gate that broke, without having to read a log;
#   * a slow gate (the Android build, the fairness proof) does not delay a fast
#     one, so `flutter analyze` reports in about two minutes instead of ten;
#   * a failing analyze does not hide the test results, and vice versa.
# The two mutation gates are deliberately NOT split, because the second one is
# only meaningful if the first one passed: `--selftest` proves the tool can say
# KILLED, SURVIVED and INVALID on demand, and without that proof a clean
# `--quick` report is just a tool that says nice things.

name: CI

# WHEN THIS RUNS.
# `push` to main catches anything that lands on trunk, including a direct commit
# or a merge. `pull_request` catches it one step earlier, on the branch, which is
# the point of the exercise: the gate should go red before the bad code is on
# main, not after.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets a human re-run the whole thing from the Actions tab without pushing an
  # empty commit — useful when a run failed for an infrastructure reason.
  workflow_dispatch:

# LEAST PRIVILEGE.
# The default token can write to the repository. Nothing here needs to write
# anything, so it is dropped to read-only. If this workflow is ever compromised
# — say by a dependency that runs code during `pub get` — it cannot push.
permissions:
  contents: read

# DO NOT PAY TWICE FOR THE SAME BRANCH.
# Pushing three times in a minute would otherwise start three full runs and the
# first two would be answering a question nobody is asking any more. This
# cancels the superseded ones. `github.ref` is the branch, so runs on different
# branches never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # WHY THE VERSION IS PINNED AND NOT `latest`.
  # This is the single most important line in the file. With `latest`, the SDK
  # under CI changes the day Flutter ships a release — and it changes without
  # anybody on this project touching anything. That means a build that was green
  # on Friday can be red on Monday over a change nobody made, and, far worse, a
  # green run stops being evidence about the code because the toolchain that
  # produced it is not the toolchain anyone tested against.
  #
  # 3.47.2 is what the project is developed against locally:
  #     Flutter 3.47.2 • channel stable • Dart 3.13.2
  # Pinning makes a toolchain upgrade a deliberate commit that shows up in the
  # diff and can be reverted, which is what an upgrade should be.
  FLUTTER_VERSION: '3.47.2'
  FLUTTER_CHANNEL: stable

  # The Android build needs a JDK. 21 matches the local
  # `jdk-21.0.3.9-hotspot`; `android/app/build.gradle.kts` compiles to Java 17
  # bytecode, so the JDK only has to be 17 or newer to run Gradle and AGP 9.1.
  JAVA_VERSION: '21'

jobs:
  # ===========================================================================
  # GATE 1 — the code analyses clean
  # ===========================================================================
  static-analysis:
    name: Gate 1 - code analyses clean
    runs-on: ubuntu-latest
    timeout-minutes: 15 # a hung job otherwise burns quota for six hours

    steps:
      - name: Check out the commit under test
        uses: actions/checkout@v5

      - name: Install the pinned Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          # CACHING, AND WHY IT IS SAFE HERE.
          # This caches the downloaded Flutter SDK (about a gigabyte) and the
          # pub package cache. The action's cache key already includes the OS,
          # the channel, the SDK version and the CPU architecture — and because
          # the version above is pinned rather than floating, that key is stable
          # and every run after the first restores instead of downloading.
          #
          # A cache is only safe when a stale entry cannot change the answer.
          # An SDK keyed by its exact version, and packages keyed by the
          # resolved dependency set, both satisfy that. Note what is NOT cached
          # anywhere in this file: `build/` and `.dart_tool/`. Those hold
          # compiled output. Restoring them could let a run pass using an
          # artefact built from *different* source, which is precisely the
          # failure a build gate exists to catch.
          cache: true

      - name: Report the toolchain actually in use
        # Printed so that a person watching the log can confirm with their own
        # eyes that the pin above took effect, rather than trusting that it did.
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Prove the analyzer finds nothing
        # `flutter analyze` exits 1 on any error, warning or lint under
        # `analysis_options.yaml` (which pulls in flutter_lints and excludes
        # only `build/` and `android/`). No `--fatal-infos` is needed: the
        # default already fails the build on an issue.
        run: flutter analyze

  # ===========================================================================
  # GATE 2 — the whole test suite passes
  # ===========================================================================
  unit-tests:
    # NAMED FOR THE PROPERTY, NOT FOR A COUNT. This job used to be called
    # "all 82 tests pass" and was still called that at 167 tests, because
    # nothing makes a number in a job name go red when it stops being true.
    # A name that states the property it checks cannot drift; the actual count
    # is in the step's own output, where it is generated rather than typed.
    name: Gate 2 - the whole test suite passes
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the commit under test
        uses: actions/checkout@v5

      - name: Install the pinned Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Prove every test in the suite still passes
        # No file arguments: `flutter test` with no paths runs everything under
        # `test/`, which is what makes this a gate over the whole suite rather
        # than over whichever files someone remembered to list. It exits 1 if
        # any test fails and 1 if any test file fails to compile.
        run: flutter test

  # ===========================================================================
  # GATE 3 — the Android app still builds
  # ===========================================================================
  # Split out on its own because it is the slowest gate by a wide margin and
  # the only one that needs a JDK, the Android SDK and Gradle. Everything else
  # would be waiting on it if they shared a job.
  android-build:
    name: Gate 3 - Android debug APK builds
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out the commit under test
        uses: actions/checkout@v5

      - name: Install JDK ${{ env.JAVA_VERSION }} for Gradle
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          # Sets JAVA_HOME for every later step, which is what the Flutter tool
          # reads to find a JDK. The Android SDK itself is already installed on
          # the ubuntu-latest image with ANDROID_HOME set, so it needs no step.

      - name: Cache Gradle's downloads
        uses: actions/cache@v4
        with:
          # Two separate things live here and both are worth keeping: the Gradle
          # distribution itself (~200 MB — `gradle-wrapper.properties` pins
          # 9.3.1) and the resolved Maven artefacts for AGP, Kotlin and the
          # AndroidX libraries.
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          # WHY THE KEY IS WHAT IT IS.
          # The cache must miss whenever the thing it caches could legitimately
          # change, and hit otherwise. What changes Gradle's downloads is the
          # build definition: the wrapper's pinned Gradle version, the plugin
          # and dependency versions in the `.gradle.kts` files, and the flags in
          # `gradle.properties`. Hashing exactly those files gives a key that
          # turns over when — and only when — one of them is edited.
          #
          # `restore-keys` is the fallback: on a miss, start from the newest
          # cache that shares the prefix and re-download only the difference.
          # Without it, one edited dependency line means downloading everything
          # from scratch.
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties', 'android/gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install the pinned Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Make the Gradle wrapper executable if it is checked in
        # A NOTE FOR WHOEVER READS THIS LOG AND SEES IT DO NOTHING.
        # `android/.gitignore` excludes `gradlew`, `gradlew.bat` and
        # `gradle-wrapper.jar`, so on a fresh clone they do not exist and the
        # Flutter tool injects its own copies (already executable) before it
        # calls Gradle. This step is therefore a no-op today, and it is here for
        # the day someone commits the wrapper from Windows: git would store it
        # without the Unix executable bit and every Linux run would then fail
        # with "Permission denied" on a file that looks perfectly fine in the
        # editor. `.gitattributes` already pins `gradlew` to LF endings for the
        # same class of reason; the mode bit is the half git does not fix.
        run: test -f android/gradlew && chmod +x android/gradlew || true

      - name: Prove the Android app still compiles and packages
        # The debug variant, not release: it needs no signing key, so it can run
        # on a public runner with no secrets, and it exercises everything that
        # can actually break — the Dart kernel compile, the Kotlin compile,
        # asset packaging and the manifest merge.
        #
        # If this ever dies with an out-of-memory error: `android/gradle.properties`
        # asks for `-Xmx8G`, which is more than a 2-core runner has. Do not edit
        # that file — it is shared with the other developer's machine. Write a
        # smaller value into `~/.gradle/gradle.properties` in a step above
        # instead; Gradle gives the home file precedence over the project one.
        run: flutter build apk --debug

      - name: Keep the APK so it can be downloaded and installed
        # Not a gate — a convenience. `if: success()` is the default, so this
        # only runs when the build actually produced an APK.
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error # an empty artifact would be a silent lie
          retention-days: 14

  # ===========================================================================
  # GATE 4 — the shipped course is still winnable
  # ===========================================================================
  # Split out because it takes roughly two minutes of pure computation and
  # depends on nothing but the Dart VM: no JDK, no Android SDK, no Gradle.
  fairness-proof:
    name: Gate 4 - the shipped course is provably winnable
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the commit under test
        uses: actions/checkout@v5

      - name: Install the pinned Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Prove a perfect player can clear the shipped obstacle pattern
        # `dart run` and not `flutter test`: `lib/game/` imports neither Flutter
        # nor Flame, so the prover runs on the bare VM with no widget tree.
        #
        # The script does two things and both matter. First it hands the prover
        # four courses that are impossible for four different reasons and one
        # that is trivially easy, and requires it to name the mechanism in each
        # case — a prover that answered "fair" to everything would pass a
        # survivability sweep while being worth nothing, so this control runs
        # first. Then it sweeps the real pattern. `_failures` is accumulated and
        # the script ends with an explicit `exit(_failures == 0 ? 0 : 1)`.
        run: dart run tool/prove_fairness.dart

  # ===========================================================================
  # GATES 5 AND 6 — the test suite is graded by mutation testing
  # ===========================================================================
  # These two share a job on purpose. Gate 6 asks "did the suite kill the
  # mutants?" and that question is only worth asking once gate 5 has shown the
  # tool is *capable* of answering "no". Running them in order in one log means
  # the proof and the result are read together.
  mutation-testing:
    name: Gates 5+6 - the test suite is graded by mutation
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out the commit under test
        uses: actions/checkout@v5

      - name: Install the pinned Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Resolve dependencies
        # Not optional here. The mutation tool runs `flutter test --no-pub`
        # hundreds of times and copies `.dart_tool/package_config.json` into
        # each worker sandbox, so the package resolution has to exist on disk
        # before it starts.
        run: flutter pub get

      # =======================================================================
      # DIAGNOSTICS — added after this job died with exit code 143
      # =======================================================================
      #
      # WHAT HAPPENED, so the next person reading this knows why three steps in
      # this job print numbers instead of proving something.
      #
      # On a `ubuntu-latest` runner this job's last step — the `--quick` one at
      # the bottom of the file — was killed two minutes and two seconds after it
      # started, having scored seven of its fifty-two mutants. The runner logged
      #
      #     ##[error]Process completed with exit code 143.
      #     Terminate orphan process: pid (3804) (dart:flutter_to)
      #
      # 143 is 128 + 15, which is the shell's way of saying the process was
      # ended by SIGTERM. Four things that would explain it were checked and
      # all four are ruled out: the job's `timeout-minutes` is 45 and this died
      # at 2m02s; the run's conclusion was "failure" and not "cancelled", so the
      # `concurrency` block above did not supersede it; the `--selftest` step
      # immediately before it passed on the same machine seconds earlier; and
      # the identical command passes on the development laptop. The other four
      # jobs in this workflow all went green on the same commit.
      #
      # The informative part of that log is not the error line, it is the two
      # silences around it: a 34-second gap between mutants 6 and 7 in a step
      # where the other gaps were 5 or 6 seconds, and then 26 seconds of nothing
      # at all before the kill. Nothing in the log explains either.
      #
      # WHY THE ANSWER IS INSTRUMENTATION AND NOT A SETTING CHANGE.
      # A bare 143 is consistent with at least four different stories — the
      # machine ran out of memory, the machine ran out of disk, the tool leaked
      # worker processes until something upstream intervened, or the hosted
      # runner itself was evicted — and there is currently no way to tell them
      # apart from the log. The cheapest thing that discriminates between them
      # is to write down what the machine looked like while it was dying, so the
      # NEXT failure is diagnosed by reading rather than by guessing. That is
      # all the three steps below do. They prove nothing and they gate nothing.
      #
      # THE RULE ABOUT `continue-on-error`, stated once here and true everywhere
      # in this job: it appears ONLY on steps that observe, and never on either
      # `dart run` step. A diagnostic that can turn a red gate green would be
      # worse than no diagnostic, because it would quietly convert this job from
      # a gate into a log. Note also that `continue-on-error` is per-step and
      # does not leak: the post-mortem step below carries both
      # `continue-on-error: true` and `if: always()`, and neither of those stops
      # a failed `--quick` step from failing the job. The job's conclusion is
      # still decided by the two `dart run` steps and nothing else.

      - name: Pre-flight - what machine did we actually get
        # Runners are not identical and the log never says which one you got.
        # This prints the shape of the machine BEFORE any Dart process starts,
        # so the numbers the sampler prints later have a baseline to be read
        # against. Everything here is a read; nothing is configured or changed.
        continue-on-error: true
        run: |
          echo "----- cpu -----"
          nproc || true
          echo "----- memory -----"
          free -m || true
          echo "----- disk -----"
          df -h / || true
          df -h /tmp || true
          echo "----- what filesystem is /tmp on -----"
          # THIS IS THE ONE TO READ FIRST, and it is the reason this step exists
          # at all. `tool/mutate.dart` builds each worker sandbox under
          # `Directory.systemTemp`, which on Linux is /tmp. If /tmp turns out to
          # be a tmpfs, then every sandbox — and every `.dart_tool/flutter_build`
          # tree that `flutter test` regenerates inside one, which the tool's own
          # comments put at 185 MB apiece — is charged against RAM rather than
          # against disk. Two workers doing that at once, on top of two live
          # `flutter test` processes, is a complete and self-contained
          # explanation for the machine running out of memory, and it would be
          # invisible in `df -h /`. If the FSTYPE column below says `tmpfs`,
          # that is the lead. If it says `ext4` or `overlay`, that hypothesis is
          # dead and the sampler's numbers are where to look instead.
          findmnt -T /tmp || true
          echo "----- swap (no output here means there is none) -----"
          # An empty result is the answer, not a missing answer. With no swap, a
          # memory squeeze has nowhere to go but the OOM killer, and processes
          # die instead of merely getting slow. Hosted runners historically ship
          # with a swapfile; whether this one did is worth knowing.
          swapon --show || true
          echo "----- ceilings -----"
          # Process and file-descriptor limits. `flutter test` opens a lot of
          # both, and two workers double it. If the tool were leaking processes,
          # `ulimit -u` is the wall it would eventually hit — and hitting it
          # produces failures that look nothing like a memory problem.
          echo "max user processes: $(ulimit -u)"
          echo "open files:         $(ulimit -n)"
          echo "----- processes already running -----"
          # Counts the header row too, so this reads exactly one higher than the
          # `procs=` field the sampler prints below. Worth knowing before
          # somebody spends ten minutes on a one-process discrepancy that is an
          # artefact of `ps` printing a header here and not there.
          ps -e | wc -l || true
          echo "----- kernel pressure stall information -----"
          # PSI, if the kernel exposes it. These are the percentage of the last
          # 10/60/300 seconds during which work was stalled waiting for memory,
          # I/O or CPU. Near-zero here is the clean baseline that makes a
          # non-zero figure in the sampler's output meaningful later.
          cat /proc/pressure/memory /proc/pressure/io /proc/pressure/cpu 2>/dev/null || \
            echo "no /proc/pressure — this kernel has PSI disabled"

      - name: Start the background resource sampler
        # WHY A SAMPLER AND NOT MORE PRINTING INSIDE THE TOOL.
        # A process that is about to be killed cannot report its own death, and
        # a step that is killed cannot print a summary. So the observer has to
        # live outside the thing being observed, and it has to write to DISK
        # rather than to the step's stdout — because a file that is already on
        # disk survives a SIGTERM that the step never gets to handle. The step
        # that reads the file back is a separate, later step, which is what
        # makes the whole arrangement work at all.
        #
        # WHY IT IS DETACHED THREE DIFFERENT WAYS.
        # The runner reaps processes that a step leaves behind — the
        # `Terminate orphan process` line in the failing log is that mechanism
        # firing. It finds them by looking for a tracking id in the process
        # environment, so a sampler that inherited that id could be reaped at
        # the end of the step that started it, and would then be dead for the
        # whole of the run it was supposed to watch. `env -u` strips the id,
        # `setsid -f` puts the sampler in its own session so it is not in the
        # step's process group, and the log file means that even if all of that
        # fails the samples taken up to that point are still on disk. The
        # `first samples` printed below are the check: if they are there, the
        # sampler started, and the post-mortem step will say how many lines it
        # managed to write.
        continue-on-error: true
        run: |
          cat > /tmp/ci-sampler.sh <<'SAMPLER'
          #!/usr/bin/env bash
          # One line every three seconds. Cheap on purpose — this runs on every
          # push, so the sampler forks exactly one `ps` per tick and reads the
          # rest straight out of /proc.
          echo $$ > /tmp/ci-sampler.pid
          i=0
          # A hard ceiling of 1200 ticks (~60 min) so a sampler that is somehow
          # never killed still stops on its own rather than spinning for the
          # life of the machine.
          while [ "$i" -lt 1200 ]; do
            i=$((i + 1))
            ts=$(date -u +%H:%M:%S)
            memav=$(awk '/^MemAvailable:/{print $2}' /proc/meminfo)
            swapfree=$(awk '/^SwapFree:/{print $2}' /proc/meminfo)
            load1=$(cut -d' ' -f1 /proc/loadavg)
            psout=$(ps -e -o rss=,comm=)
            procs=$(printf '%s\n' "$psout" | wc -l)
            # dartprocs is the orphan-leak counter: how many flutter/dart/test
            # processes exist right now, and how much resident memory they hold
            # between them. A number that climbs mutant over mutant instead of
            # returning to its floor is a leak, observed rather than suspected.
            pair=$(printf '%s\n' "$psout" | awk '/flutter|dart|_tester/ {n++; r+=$1} END {printf "%d %d", n+0, r+0}')
            dartn=${pair% *}
            dartrss=${pair#* }
            psi=na
            if [ -r /proc/pressure/memory ]; then
              psi=$(awk '/^some/{print $2}' /proc/pressure/memory)
              psi=${psi#avg10=}
            fi
            echo "[sample] t=${ts} memavail_kb=${memav} swapfree_kb=${swapfree} load1=${load1} procs=${procs} dartprocs=${dartn} dartrss_kb=${dartrss} mempsi10=${psi}"
            sleep 3
          done
          SAMPLER
          chmod +x /tmp/ci-sampler.sh
          : > /tmp/ci-resource-samples.log
          env -u _PROCESS_TRACKING_ID -u VSTS_PROCESS_LOOKUP_ID \
            setsid -f bash /tmp/ci-sampler.sh >> /tmp/ci-resource-samples.log 2>&1 || true
          sleep 1
          echo "sampler pid: $(cat /tmp/ci-sampler.pid 2>/dev/null || echo '<not recorded — the sampler did not start>')"
          echo "first samples:"
          head -n 3 /tmp/ci-resource-samples.log || true

      - name: Prove the mutation tool can still tell its three verdicts apart
        # THE CONTROL, AND WHY IT COMES FIRST.
        # A mutation harness whose edits never reach the disk reports a perfect
        # score and looks exactly like a perfect test suite. `--selftest` forces
        # the tool to produce each verdict on demand:
        #   POSITIVE  gravity x10, judged by the tests that watch the model
        #                                                      -> must be KILLED
        #   NEGATIVE  the same edit, judged only by widget_test.dart, which
        #             never ticks the model                   -> must be SURVIVED
        #   INVALID   a syntactically broken edit             -> must be INVALID
        # The negative control is the one people leave out, and it is the one
        # that rules out "always reports killed".
        #
        # WHY `--timeout=180` HERE WHEN THE DEFAULT IS 45.
        # The tool counts a run that does not finish in time as a kill, and its
        # own comments say why that is weaker evidence than a failing assertion:
        # "did not finish" has innocent explanations. A hosted runner is slower
        # and colder than a development laptop, and the very first `flutter test`
        # of a run pays for compiling the whole test kernel. A short timeout
        # there would turn the POSITIVE control into a timeout-kill and fail the
        # self-test for a reason that has nothing to do with the code. Raising
        # the ceiling makes each verdict rest on a real test result.
        #
        # WHY `--heartbeat=15` IS SPELLED OUT WHEN 15 IS ALREADY THE DEFAULT.
        # The tool prints a `[hb]` line every fifteen seconds giving elapsed
        # time, mutants done, its own resident memory, its process count and
        # what is currently in flight. That is the inside view of the same
        # silences the sampler is watching from outside, and having both means a
        # gap in the log can be attributed: if the heartbeat keeps ticking
        # through a quiet stretch the tool was alive and waiting on something,
        # and if the heartbeat stops too the whole process was stalled or gone.
        # Written out here rather than left to the default so that the person
        # reading this file can see that heartbeats are on without going to read
        # the tool to find out what the default is.
        run: dart run tool/mutate.dart --selftest --timeout=180 --heartbeat=15

      - name: Prove the suite still notices deliberate breakage
        # The stratified subset: a fixed budget of 52 mutants, apportioned
        # between the six operator families in proportion to their size with a
        # floor of two each, then picked at evenly spaced indices within each
        # family. Selection is integer arithmetic with no randomness and no
        # clock, so the same commit always yields the same subset and anything
        # CI flags can be reproduced locally with `--only=<id>`. A survivor — a
        # mutant every test passed over — exits 1.
        #
        # WHY A BUDGET AND NOT A FRACTION, which is what this used to be. The
        # old rule took an eighth of every family, so the subset was a fixed
        # share of a surface that only grows. Four files were added to
        # `lib/game/`, the surface went 410 -> 1225 mutants, and this step
        # silently went 52 -> 154 mutants — tripling a job that has a
        # 45-minute ceiling, in a commit that was about something else. The
        # budget lives in `quickBudget` in the tool and pins the CI cost where
        # it was measured.
        #
        # WHY `--jobs=2` IS STILL RIGHT AT 52 MUTANTS. It is sized for the
        # machine, not for the workload: a standard hosted Linux runner has 2
        # cores on a private repository (4 if the repository is public). Each
        # job is a whole `flutter test` process working in its own sandbox copy
        # of the package, so oversubscribing would not go faster; it would push
        # every run closer to the timeout and make the verdicts mushier — and a
        # timeout is the weakest kind of kill. If this repository is public,
        # raising this to 4 is safe and roughly halves the step.
        #
        # WHY `--timeout=180` IS STILL RIGHT. Also sized for the machine rather
        # than the workload: it is the ceiling on ONE `flutter test`, not on the
        # step, so shrinking the subset does not make it less necessary. The
        # first run of the job pays for compiling the whole test kernel on a
        # cold, slow runner; a tight ceiling there converts an ordinary run into
        # a timeout-kill, and a timeout-kill is evidence that the run did not
        # finish, not evidence that the suite noticed anything.
        #
        # BUDGET AGAINST THE JOB TIMEOUT. Measured on the development machine at
        # `--jobs=4`: 163.7s, 201.4s and 237.9s over three runs of the identical
        # 52-mutant subset. Before the budget went in the same step was 670.3s.
        #
        # The spread is not noise in the measurement, it is the cost of the
        # timeout-kills: those three runs scored 2, 7 and 8 mutants as
        # KILLED(t/o), and a mutant that hangs the suite burns the whole
        # `--timeout` before it is scored, while one that fails an assertion is
        # done in seconds. Every one of them stayed a kill, so the verdict never
        # moved — only the clock did.
        #
        # That is what to watch here, because this job raises the ceiling to
        # 180s. Eight timeout-kills cost ~24 minutes of single-core time at that
        # setting, or ~12 minutes across two jobs, on top of the ~6 minutes the
        # other 44 mutants take. It fits inside 45 minutes with room to spare,
        # but the margin is the reason the budget is 52 and not 154: at the old
        # size this arithmetic did not fit at all.
        #
        # -------------------------------------------------------------------
        # WHY NEITHER `--jobs` NOR `--timeout` WAS TOUCHED WHEN THIS STEP
        # STARTED DYING WITH EXIT 143
        # -------------------------------------------------------------------
        #
        # This is a deliberate ruling and not an oversight, so here is the
        # argument in full.
        #
        # Lowering `--jobs` to 1 is the obvious first move and it is the wrong
        # one. Start with what it would actually fix. The leading code-level
        # explanation for the two unexplained silences in the failing log is
        # that something inside the tool waited with no ceiling on it. A wait
        # with no ceiling does not care how many workers there are — one worker
        # can hang exactly as thoroughly as two, it just takes twice as long to
        # get to the hang. So the change most likely to be proposed is also the
        # change least likely to address the thing that is suspected.
        #
        # Now the part that makes it tempting anyway: lowering it would cost
        # nothing in detection power. `--jobs` changes wall-clock time and
        # nothing else. It does not change which mutants are selected — the
        # `--quick` subset is fixed integer arithmetic over a budget of 52, with
        # no randomness and no clock in it, so the same commit yields the same
        # 52 mutants at any job count — and it does not change a single verdict,
        # because each worker judges its own mutant in its own sandbox copy of
        # the package. A cheap change that costs no coverage is exactly the kind
        # of change that gets made without thinking about it.
        #
        # And that is the actual reason not to make it now. The diagnostics
        # added above are landing in this same commit. If `--jobs` moved at the
        # same time and the next run went green, there would be no way to say
        # whether the job count fixed it, whether the diagnostics perturbed the
        # timing, or whether the runner was simply having a better day. One
        # variable at a time, or the green run teaches nothing.
        #
        # LOWERED TO 1 ON THE EVIDENCE, 2026-09-04. The run at fa8254b was
        # cancelled by the runner after 1m46s, and the death report said why:
        #
        #   pressure/memory: some avg10=64.23  full avg10=60.63
        #   MemAvailable 8950340 kB , SwapFree 1224180 kB
        #   ##[error]The operation was canceled.
        #
        # `full avg10=60.63` means the WHOLE MACHINE was stalled waiting on
        # memory for 60% of the preceding ten seconds. Swap had gone from
        # 3145724 kB free at baseline to 1224180 kB — about 2 GB pushed out.
        # The runner then cancelled the job, which is who sent the SIGTERM that
        # started this whole investigation.
        #
        # THE RELEASE CONDITION WRITTEN HERE PREVIOUSLY WATCHED THE WRONG
        # NUMBERS, and that is worth recording rather than quietly replacing.
        # It said to lower `--jobs` when `memavail_kb` fell toward a few hundred
        # megabytes, or when `dartprocs` accumulated. Neither happened:
        # MemAvailable was still 8.9 GB at the moment of death, and the process
        # count only drifted 163 -> 171. MemAvailable counts reclaimable page
        # cache, so it stays comfortable right up until the machine is thrashing
        # to keep it that way. The number that actually showed the fault was
        # pressure/memory, which is why the sampler collects it.
        #
        # Two concurrent `flutter test` trees, each compiling the suite, is
        # simply more than a 4-core hosted runner will carry. Dropping to one
        # worker costs wall clock and nothing else: the subset is fixed integer
        # arithmetic, and each worker judges its own mutant in its own sandbox,
        # so the job count cannot change a single verdict.
        #
        # `--timeout` is not the thing to change either, and the arithmetic is
        # worth writing down because it is not obvious. 180 seconds is the
        # ceiling on ONE `flutter test` invocation, not on a mutant and not on
        # the step. `_judge` in the tool runs tier 1 first, and escalates every
        # tier-1 survivor to a re-run against the whole suite before it will
        # call it a survivor — two invocations, so one mutant can legitimately
        # occupy a worker for up to 360 seconds without anything being wrong.
        # Even at that worst case, 52 mutants across two workers sits well
        # inside the job's 45-minute ceiling, and the step died at 2m02s, which
        # is nowhere near any timeout in this file. Lowering it would only start
        # converting slow-but-honest runs into timeout-kills, and a timeout-kill
        # is the weakest verdict the tool produces.
        #
        # Nothing here shrinks the mutant budget either. The step is failing for
        # a reason nobody understands yet; weakening the gate until it stops
        # complaining would remove the evidence rather than the fault.
        run: dart run tool/mutate.dart --quick --jobs=1 --timeout=180 --heartbeat=15

      - name: Post-mortem - what the machine looked like when the step ended
        # THE STEP THAT MAKES ALL THE OTHERS WORTH HAVING.
        # `if: always()` is the entire point: without it this step is skipped on
        # exactly the runs it was written for, because a job stops at its first
        # failed step and the failure IS the event under investigation. With it,
        # this runs after the `--quick` step whether that step passed, failed or
        # was killed outright.
        #
        # `continue-on-error: true` is here for the same reason it is on the two
        # steps above — these are observations, and an observation that can fail
        # a build is a liability. It does not and cannot rescue a failed
        # `--quick` step: that step has no `continue-on-error` of its own, so
        # its failure still fails the job.
        if: always()
        continue-on-error: true
        run: |
          # Stop the sampler first, so the tail below is not moving while it is
          # being read. Both forms are tried because the pid file is written by
          # the sampler itself and may not exist if it never started.
          kill "$(cat /tmp/ci-sampler.pid 2>/dev/null)" 2>/dev/null || true
          pkill -f ci-sampler.sh || true

          echo "===== BEGIN resource samples ====="
          # HOW TO READ THIS. One line every three seconds, so 200 lines is
          # about the last ten minutes — comfortably more than the two minutes
          # the failing step survived. Read the last few lines first and ask
          # three questions in this order. Was `memavail_kb` collapsing, and was
          # `swapfree_kb` going with it? That is memory exhaustion. Was
          # `mempsi10` climbing off zero? That is the kernel saying it was
          # stalling on memory even if it never had to kill anything. Was
          # `dartprocs` growing steadily instead of oscillating around a small
          # number? That is a process leak, and `dartrss_kb` says what it cost.
          # If all three are flat and boring right up to the last sample, then
          # the machine was healthy when the step died and the cause is
          # external — which is a real answer and a very different one.
          echo "sample count:"
          wc -l /tmp/ci-resource-samples.log || true
          echo "first sample (so the covered window is known):"
          head -n 1 /tmp/ci-resource-samples.log || true
          echo "-----"
          tail -n 200 /tmp/ci-resource-samples.log || true
          echo "===== END resource samples ====="

          echo "===== BEGIN process table, biggest first ====="
          # THE SINGLE MOST VALUABLE LINE IN THIS WHOLE STEP. It names every
          # surviving process with its resident memory AND its age. The failing
          # run's own log ended with the runner reporting
          # `Terminate orphan process: pid (3804) (dart:flutter_to)`, which says
          # something was still alive after the step was gone but not what it
          # was or how long it had been there. `etime` answers that: an orphan
          # whose elapsed time is longer than the mutant that spawned it is a
          # leaked worker, and that is direct evidence for the process-leak
          # hypothesis rather than an inference from a silence.
          ps -eo pid,ppid,rss,etime,stat,comm,args --sort=-rss | head -30 || true
          echo "===== END process table ====="

          echo "===== BEGIN memory and disk after the fact ====="
          free -m || true
          df -h || true
          echo "===== END memory and disk after the fact ====="

          echo "===== BEGIN kernel kill search ====="
          # WHAT AN EMPTY RESULT HERE MEANS — read this before concluding
          # anything, because a grep that prints nothing must not be mistaken
          # for a check that was not run.
          #
          # Both of the kernel-side memory killers, the in-kernel OOM killer and
          # systemd-oomd, kill with SIGKILL. A process killed by SIGKILL exits
          # 137 (128 + 9). The code actually observed was 143 (128 + 15), which
          # is SIGTERM — something asked the process to stop rather than shot
          # it. So this search is the test that separates the two memory
          # stories from everything else: if it finds an OOM line, the machine
          # ran out of memory and the exit code needs re-explaining; if it finds
          # nothing, that is evidence AGAINST a simple out-of-memory kill and
          # points instead at a platform- or agent-issued terminate — the runner
          # itself, an eviction, or something in the tool asking a child to
          # stop. The explicit "no OOM lines" message below exists so that the
          # difference between "checked and found nothing" and "never checked"
          # is visible in the web log.
          sudo dmesg -T 2>/dev/null | tail -n 100 | grep -iE 'oom|killed process|out of memory' \
            || echo "dmesg: checked the last 100 kernel messages, no OOM lines"
          sudo journalctl -k --since "-10 min" --no-pager 2>/dev/null | grep -iE 'oom|killed process|out of memory' \
            || echo "journalctl -k: checked the last 10 minutes, no OOM lines"
          echo "===== END kernel kill search ====="
